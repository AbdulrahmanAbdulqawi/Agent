version: '3.8'

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Providers__AnthropicApiKey=${ANTHROPIC_API_KEY:-}
      - Providers__OpenAIApiKey=${OPENAI_API_KEY:-}
      - Providers__CursorApiKey=${CURSOR_API_KEY:-}
    volumes:
      - agent-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  agent-data:
